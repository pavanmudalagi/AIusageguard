services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_usage_guard
      POSTGRES_USER: ai_guard
      POSTGRES_PASSWORD: ai_guard_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_guard -d ai_usage_guard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
